<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Property Detail · Choice Properties Admin</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="/css/cp-design.css?v=__BUILD_VERSION__">
<script defer src="/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
<script defer src="/js/cp-api.js" type="module"></script>
<script defer src="/js/cp-chrome.js?v=__BUILD_VERSION__"></script>
<script defer src="/js/cp-shell.js?v=__BUILD_VERSION__"></script>
<style>
/* ── Gallery / Mosaic ── */
.pd-mosaic{display:grid;grid-template-columns:1fr;gap:4px;border-radius:var(--r-md);overflow:hidden;margin-bottom:4px}
@media(min-width:640px){.pd-mosaic{grid-template-columns:2fr 1fr}}
.pd-mosaic-main{position:relative;min-height:220px;max-height:420px;overflow:hidden;cursor:pointer;background:var(--surface-2)}
.pd-mosaic-main img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s}
.pd-mosaic-side{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px}
.pd-mosaic-cell{position:relative;overflow:hidden;cursor:pointer;background:var(--surface-2);min-height:100px}
.pd-mosaic-cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.pd-mosaic-cell:hover img{transform:scale(1.04)}
.pd-mosaic-cell.drag-over{outline:2px solid var(--brand)}
.pd-mosaic-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.9rem}
.pd-mosaic-prev,.pd-mosaic-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .15s}
.pd-mosaic-prev{left:8px} .pd-mosaic-next{right:8px}
.pd-mosaic-prev:hover,.pd-mosaic-next:hover{background:rgba(0,0,0,.8)}
.pd-photo-count{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;pointer-events:none}
.pd-expand-btn{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:.74rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s}
.pd-expand-btn:hover{background:rgba(0,0,0,.85)}
.pd-no-photo{height:180px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:var(--r-md);color:var(--muted);margin-bottom:4px;font-size:.82rem}

/* ── Gallery strip ── */
.pd-gallery-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;margin-bottom:16px;scrollbar-width:thin}
.pd-strip-thumb{flex:0 0 auto;width:60px;height:46px;border-radius:5px;overflow:hidden;border:2px solid transparent;cursor:pointer;padding:0;background:none;transition:border-color .15s}
.pd-strip-thumb.active{border-color:var(--brand)}
.pd-strip-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* ── Header ── */
.pd-header{margin-bottom:16px}
.pd-header-price{font-size:1.6rem;font-weight:800;color:var(--text);margin-bottom:2px}
.pd-header-price span{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:3px}
.pd-header-title{font-size:1.1rem;font-weight:800;color:var(--text);margin:0 0 4px}
.pd-header-address{font-size:.82rem;color:var(--muted);margin-bottom:4px}
.pd-listed-by{font-size:.78rem;color:var(--muted)}
.pd-listed-by strong{color:var(--text)}

/* ── Sections ── */
.pd-section{margin-bottom:20px}
.pd-section-title{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.pd-grid{grid-template-columns:repeat(3,1fr)}}
.pd-field{display:flex;flex-direction:column;gap:3px}
.pd-field-label{font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pd-field-value{font-size:.88rem;font-weight:600;color:var(--text)}
.pd-desc{font-size:.84rem;color:var(--text);line-height:1.65;white-space:pre-wrap;background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px}
.pd-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

/* ── Status toggle ── */
.pd-status-toggle{display:flex;gap:6px;flex-wrap:wrap}
.pd-status-chip{padding:6px 16px;border-radius:99px;font-size:.78rem;font-weight:700;cursor:pointer;border:2px solid transparent;background:var(--surface-2);color:var(--muted);transition:all .15s}
.pd-status-chip:hover{background:var(--surface-3,var(--surface));color:var(--text)}
.pd-status-chip.is-current{cursor:default}
.pd-status-chip.active.is-current{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.5);color:#16a34a}
.pd-status-chip.rented.is-current{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.5);color:#2563eb}
.pd-status-chip.inactive.is-current{background:var(--surface-2);border-color:var(--border);color:var(--muted)}
.pd-status-chip.maintenance.is-current{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.5);color:#b45309}
.pd-status-check{font-size:.7rem;margin-left:2px}

/* ── Tabs ── */
.pd-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.pd-tab{padding:6px 16px;border-radius:99px;font-size:.8rem;font-weight:700;cursor:pointer;border:none;background:var(--surface-2);color:var(--muted);transition:all .15s}
.pd-tab.active{background:var(--brand);color:#fff}
.pd-panel{display:none}
.pd-panel.active{display:block}
.pd-amenity-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:480px){.pd-amenity-grid{grid-template-columns:repeat(3,1fr)}}
.pd-amenity-item{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--text);padding:6px 0}
.pd-amenity-item i{color:var(--brand);flex-shrink:0;width:14px;text-align:center}

/* ── Map ── */
.pd-map-wrap{height:260px;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2)}

/* ── Landlord card ── */
.pd-landlord{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--surface-2);border-radius:var(--r-md)}
.pd-landlord-avatar{width:46px;height:46px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:#fff;flex-shrink:0;overflow:hidden}
.pd-landlord-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.pd-landlord-name{font-weight:700;font-size:.9rem;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pd-landlord-tagline{font-size:.76rem;color:var(--muted);font-style:italic}
.pd-landlord-meta{font-size:.74rem;color:var(--muted)}

/* ── Tables ── */
.pd-table{width:100%;border-collapse:collapse;font-size:.8rem}
.pd-table th{text-align:left;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--border)}
.pd-table td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.pd-table tr:last-child td{border-bottom:none}
.pd-table tr:hover td{background:var(--surface-2)}
.pd-empty-row{color:var(--muted);font-size:.8rem;padding:14px 10px;font-style:italic}

/* ── Lightbox ── */
.pd-lightbox{display:none;position:fixed;inset:0;z-index:9999}
.pd-lightbox.open{display:flex}
.pd-lb-overlay{position:absolute;inset:0;background:rgba(0,0,0,.92)}
.pd-lb-inner{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;z-index:1;padding:60px 20px 100px}
.pd-lb-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;max-width:1100px;width:100%}
.pd-lb-img-wrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;transition:opacity .12s}
.pd-lb-close{position:absolute;top:14px;right:16px;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .15s}
.pd-lb-close:hover{background:rgba(255,255,255,.15)}
.pd-lb-prev,.pd-lb-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;font-size:1.8rem;cursor:pointer;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.pd-lb-prev{left:12px} .pd-lb-next{right:12px}
.pd-lb-prev:hover,.pd-lb-next:hover{background:rgba(255,255,255,.25)}
.pd-lb-counter{color:rgba(255,255,255,.7);font-size:.8rem;margin-top:10px}
.pd-lb-thumbs{display:flex;gap:6px;overflow-x:auto;max-width:min(100%,900px);padding:6px 2px;margin-top:8px}
.pd-lb-thumb{flex:0 0 auto;width:56px;height:44px;overflow:hidden;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0;background:none;transition:border-color .15s}
.pd-lb-thumb.active{border-color:#fff}
.pd-lb-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* ── Edit panel / Photo manager ── */
.pd-edit-panel{display:none;position:fixed;inset:0;z-index:9000}
.pd-edit-panel.open{display:flex}
.pd-edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.pd-edit-drawer{position:absolute;right:0;top:0;bottom:0;width:min(540px,100%);background:var(--surface);display:flex;flex-direction:column;box-shadow:-4px 0 32px rgba(0,0,0,.3);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.pd-edit-panel.open .pd-edit-drawer{transform:translateX(0)}
.pd-edit-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.pd-edit-header h3{font-size:1rem;font-weight:800;color:var(--text);margin:0}
.pd-edit-close{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.pd-edit-close:hover{background:var(--surface-2)}
.pd-edit-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:20px}
.pd-edit-footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0}
.pd-edit-group{display:flex;flex-direction:column;gap:12px}
.pd-edit-group-title{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--border)}
.pd-edit-label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:700;color:var(--text)}
.pd-edit-hint{font-size:.66rem;font-weight:500;color:var(--muted)}
.pd-edit-input{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;font-size:.84rem;color:var(--text);outline:none;transition:border-color .15s;font-family:inherit;width:100%;box-sizing:border-box}
.pd-edit-input:focus{border-color:var(--brand)}
textarea.pd-edit-input{resize:vertical;min-height:60px}
select.pd-edit-input{cursor:pointer}
.pd-edit-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}

/* ── Photo manager ── */
.pd-pm-hint{font-size:.78rem;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:6px}
.pd-pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pd-pm-item{position:relative;border-radius:var(--r-md);overflow:hidden;cursor:grab;background:var(--surface-2);border:2px solid transparent;transition:border-color .15s;aspect-ratio:4/3}
.pd-pm-item.dragging{opacity:.4;cursor:grabbing;border-color:var(--brand)}
.pd-pm-item.drag-over{border-color:var(--brand);box-shadow:0 0 0 2px rgba(var(--brand-rgb,.2),.25)}
.pd-pm-item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pd-pm-handle{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:3px 5px;font-size:.7rem;cursor:grab;z-index:2}
.pd-pm-order{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.65);color:#fff;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:4px;pointer-events:none}
.pd-pm-badge{position:absolute;top:4px;right:30px;background:#f59e0b;color:#000;font-size:.68rem;font-weight:800;padding:2px 6px;border-radius:4px;pointer-events:none}
.pd-pm-delete{position:absolute;top:4px;right:4px;background:rgba(220,38,38,.85);color:#fff;border:none;border-radius:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.72rem;transition:background .15s;z-index:3}
.pd-pm-delete:hover{background:#b91c1c}
</style>
</head>

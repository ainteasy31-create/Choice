<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/cp-error-reporter.js?v=1784145767610"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Pipeline · Choice Properties Admin</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/css/cp-design.css?v=1784145767610">
<script defer src="/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
<script defer src="/js/cp-api.js" type="module"></script>
<script defer src="/js/cp-chrome.js?v=1784145767610"></script>
<script defer src="/js/cp-shell.js?v=1784145767610"></script>
<style>
  /* ═══════════════════════════════════════════════════════════
     PREMIUM PIPELINE UI — Mobile-first, polished, professional
     ═══════════════════════════════════════════════════════════ */

  :root{
    --pl-radius: 16px;
    --pl-radius-sm: 10px;
    --pl-shadow: 0 4px 24px rgba(0,0,0,.12);
    --pl-shadow-lg: 0 8px 40px rgba(0,0,0,.2);
    --pl-transition: .2s cubic-bezier(.4,0,.2,1);
  }

  /* ── Filter toolbar ─────────────────────────────────────── */
  .pl-toolbar{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-2);
    margin-bottom:var(--sp-4);position:sticky;top:0;z-index:20;background:var(--surface);
    padding-top:10px;backdrop-filter:blur(10px)}
  .pl-toolbar .chip-row,
  .source-chip-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pl-toolbar .chip-row{overflow-x:auto;min-width:0}
  .source-chip-row{overflow-x:auto;min-width:0}
  .source-chip-row .chip,
  .pl-toolbar .chip-row .chip{flex:0 0 auto}
  .chip-count{display:inline-flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.18);color:inherit;font-size:.65rem;font-weight:700;
    min-width:18px;height:18px;border-radius:9px;padding:0 5px;margin-left:5px;vertical-align:middle}
  .chip.active .chip-count{background:rgba(255,255,255,.28)}

  .source-chip-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .source-filter-label{font-size:.68rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted-2);white-space:nowrap}
  .chip-sm{padding:3px 11px;font-size:.72rem;height:auto;line-height:1.5}

  /* ── Address search ──────────────────────────────────────── */
  .pl-search-wrap{position:relative;width:100%;max-width:480px}
  .pl-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;opacity:.45;pointer-events:none}
  #pl-search{width:100%;box-sizing:border-box;
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:7px 32px 7px 32px;font-size:.84rem;color:var(--text);font-family:inherit}
  #pl-search:focus{outline:none;border-color:var(--brand)}
  #pl-search::placeholder{color:var(--muted-2)}
  .pl-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;color:var(--muted-2);font-size:1rem;
    line-height:1;padding:2px 4px;display:none}
  .pl-search-clear:hover{color:var(--text)}
  .pl-search-count{font-size:.72rem;color:var(--muted-2);margin-top:4px;display:none}

  /* ── Pipeline grid ──────────────────────────────────────── */
  #pl-list{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:580px){#pl-list{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:960px){#pl-list{grid-template-columns:repeat(3,1fr)}}

  /* ── Premium card ───────────────────────────────────────── */
  .pl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--pl-radius);
    display:flex;flex-direction:column;overflow:hidden;cursor:pointer;
    position:relative;transition:border-color .15s,box-shadow .15s,transform .15s}
  .pl-card:hover{border-color:var(--brand);box-shadow:var(--pl-shadow);transform:translateY(-1px)}
  .pl-card.pl-card-selected{border-color:var(--brand);background:rgba(var(--brand-rgb,99,102,241),.05)}
  .pl-thumb-wrap{position:relative;width:100%;padding-top:56%;background:var(--surface-2);flex-shrink:0;border-radius:var(--pl-radius) var(--pl-radius) 0 0}
  .pl-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .pl-thumb-strip{position:absolute;inset:0;display:flex;overflow:hidden}
  .pl-thumb-strip-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .pl-photo-count-badge{position:absolute;top:8px;right:8px;z-index:2;
    background:rgba(0,0,0,.7);color:#fff;font-size:.68rem;font-weight:600;
    padding:3px 8px;border-radius:12px;pointer-events:none}
  .pl-thumb-placeholder{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;background:var(--surface-2);color:var(--muted-2)}
  .pl-card-check{position:absolute;top:8px;left:8px;z-index:2;display:flex;align-items:center;
    justify-content:center;width:26px;height:26px;border-radius:6px;background:rgba(0,0,0,.52);
    backdrop-filter:blur(3px);cursor:pointer;transition:background .15s}
  .pl-card-check:hover{background:rgba(0,0,0,.72)}
  .pl-card-check input[type="checkbox"]{width:15px;height:15px;cursor:pointer;accent-color:var(--brand);margin:0}
  .pl-card-badges{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
  .pl-body{padding:11px 14px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .pl-addr{font-size:.88rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-meta{font-size:.74rem;color:var(--muted-2)}
  .pl-rent{font-size:.94rem;font-weight:800;color:var(--text);margin-top:2px}
  .pl-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
  .pl-card-ft{display:flex;gap:6px;padding:8px 12px 10px;align-items:center;
    justify-content:flex-end;flex-shrink:0;border-top:1px solid var(--border)}
  .pl-card-ft .btn{font-size:.72rem;padding:5px 11px;white-space:nowrap}

  /* ── Source badge ───────────────────────────────────────── */
  .src-badge{display:inline-flex;align-items:center;font-size:.65rem;font-weight:700;
    letter-spacing:.02em;padding:2px 7px;border-radius:99px;text-transform:uppercase}
  .src-zillow {background:rgba(0,106,255,.12);color:#0055cc}
  .src-realtor{background:rgba(220,38,38,.12);color:#b91c1c}

  /* ── Quality score ──────────────────────────────────────── */
  .qs-badge{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px}
  .qs-high{background:rgba(34,197,94,.15);color:#16a34a}
  .qs-mid {background:rgba(234,179,8,.15);color:#a16207}
  .qs-low {background:rgba(239,68,68,.15);color:#dc2626}

  /* ── Empty / loading ────────────────────────────────────── */
  .pl-empty{text-align:center;padding:60px 24px;color:var(--muted-2)}
  .pl-empty svg{width:40px;height:40px;margin:0 auto 12px;display:block;opacity:.4}
  .pl-empty h3{font-size:1rem;font-weight:700;color:var(--text);margin:0 0 6px}
  .pl-empty p{font-size:.82rem;margin:0}

  /* ═══════════════════════════════════════════════════════
     FOLDER SYSTEM — Premium redesign (mobile-first)
     ═══════════════════════════════════════════════════════ */

  /* Folder chips container — horizontally scrollable on mobile */
  .pl-folder-scroll{
    display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;
    scrollbar-width:none;scroll-snap-type:x mandatory;
  }
  .pl-folder-scroll::-webkit-scrollbar{display:none}

  /* Premium folder chip card */
  .pl-folder-chip{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:8px 14px;border-radius:var(--pl-radius-sm);
    background:var(--surface);border:1.5px solid var(--border);
    cursor:pointer;transition:all var(--pl-transition);
    scroll-snap-align:start;position:relative;
    min-width:140px;max-width:220px;
  }
  .pl-folder-chip:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--pl-shadow)}
  .pl-folder-chip.active{
    border-color:var(--brand);background:rgba(99,102,241,.08);
    box-shadow:0 2px 12px rgba(99,102,241,.15);
  }
  .pl-folder-chip .pl-folder-ic{
    width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-size:1.1rem;flex-shrink:0;
  }
  .pl-folder-chip .pl-folder-ic.dark-text{color:#000}
  .pl-folder-chip .pl-folder-ic.light-text{color:#fff}
  .pl-folder-chip-info{flex:1;min-width:0}
  .pl-folder-chip-name{font-size:.78rem;font-weight:700;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-folder-chip-meta{font-size:.64rem;color:var(--muted-2);margin-top:1px}
  .pl-folder-chip .pl-folder-count{
    font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;
    background:rgba(255,255,255,.14);color:var(--muted-2);flex-shrink:0;
    margin-left:auto;
  }
  .pl-folder-chip.active .pl-folder-count{background:rgba(99,102,241,.2);color:var(--brand)}

  /* "All pipeline" chip — always first */
  .pl-folder-chip-all{
    background:var(--surface-2);border-style:dashed;
  }
  .pl-folder-chip-all .pl-folder-ic{background:transparent;color:var(--muted-2)}

  /* Add folder button */
  .pl-folder-chip-add{
    border-style:dashed;color:var(--brand);font-weight:600;
    justify-content:center;min-width:110px;
  }
  .pl-folder-chip-add:hover{background:rgba(99,102,241,.08)}

  /* Folder banner — active folder context */
  .pl-folder-banner{
    display:none;gap:12px;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.08));
    border:1px solid rgba(99,102,241,.25);border-radius:var(--pl-radius);
    padding:12px 16px;margin-bottom:var(--sp-3);
  }
  .pl-folder-banner.visible{display:flex;animation:fadeUp .2s ease}
  .pl-folder-banner-title{font-size:.88rem;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:8px}
  .pl-folder-banner-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
  .pl-folder-banner-meta{font-size:.76rem;color:var(--muted-2);line-height:1.4;margin-top:2px}
  .pl-folder-banner-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0}
  .pl-folder-banner-actions .btn{padding:6px 10px;font-size:.72rem}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* Mobile: folder chips take full width */
  @media(max-width:580px){
    .pl-folder-scroll{padding-bottom:10px}
    .pl-folder-chip{min-width:150px}
  }

  /* ═══════════════════════════════════════════════════════
     FOLDER MODAL — Premium bottom-sheet (mobile-first)
     ═══════════════════════════════════════════════════════ */
  .pl-folder-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;opacity:0;transition:opacity .2s;pointer-events:none}
  .pl-folder-modal-backdrop.open{opacity:1;pointer-events:auto}
  .pl-folder-modal-sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:401;
    background:var(--surface);border-radius:20px 20px 0 0;
    box-shadow:var(--pl-shadow-lg);padding:16px 20px 20px;
    max-height:min(85dvh,640px);overflow-y:auto;
    transform:translateY(115%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    animation:fadeUp .2s ease;
  }
  .pl-folder-modal-sheet.open{transform:translateY(0)}
  .pl-folder-modal-sheet::before{
    content:'';display:block;width:40px;height:4px;border-radius:2px;
    background:var(--border);margin:0 auto 16px;
  }
  .pl-folder-modal-title{font-size:1rem;font-weight:800;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .pl-folder-modal-sub{font-size:.78rem;color:var(--muted-2);margin-bottom:16px}
  .pl-folder-form-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .pl-folder-form-field label{font-size:.7rem;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em}
  .pl-folder-form-field input,.pl-folder-form-field select,.pl-folder-form-field textarea{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:10px 12px;font-size:.88rem;color:var(--text);font-family:inherit;width:100%;box-sizing:border-box}
  .pl-folder-form-field input:focus,.pl-folder-form-field select:focus{border-color:var(--brand);outline:none}

  /* Color picker — premium swatches */
  .pl-color-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .pl-color-swatch{
    width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;
    transition:transform .15s,box-shadow .15s;position:relative;
  }
  .pl-color-swatch:hover{transform:scale(1.1);box-shadow:0 2px 12px rgba(0,0,0,.2)}
  .pl-color-swatch.selected{border-color:#fff;box-shadow:0 0 0 2px var(--brand)}
  .pl-color-swatch.selected::after{
    content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:1rem;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.5);
  }

  /* Icon picker */
  .pl-icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
  .pl-icon-option{
    display:flex;align-items:center;justify-content:center;height:44px;border-radius:10px;
    cursor:pointer;font-size:1.3rem;border:2px solid transparent;background:var(--surface-2);
    transition:all .15s;
  }
  .pl-icon-option:hover{transform:scale(1.08);background:rgba(99,102,241,.1)}
  .pl-icon-option.selected{border-color:var(--brand);background:rgba(99,102,241,.12);box-shadow:0 0 0 1px var(--brand)}
  @media(max-width:480px){.pl-icon-grid{grid-template-columns:repeat(5,1fr)}}

  .pl-folder-modal-actions{display:flex;gap:10px;margin-top:18px}
  .pl-folder-modal-actions .btn{flex:1;padding:10px 14px;font-size:.88rem;font-weight:700;border-radius:10px}

  /* Folder picker list */
  .pl-folder-picker-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .pl-folder-picker-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-radius:var(--r-sm);background:var(--surface-2);
    border:1px solid var(--border);cursor:pointer;transition:all .15s;
  }
  .pl-folder-picker-item:hover{border-color:var(--brand);background:rgba(99,102,241,.05)}
  .pl-folder-picker-item .pl-folder-picker-ic{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-size:1rem;flex-shrink:0;
  }
  .pl-folder-picker-item .pl-folder-picker-name{font-size:.85rem;font-weight:600;color:var(--text);flex:1;min-width:0}
  .pl-folder-picker-item .pl-folder-picker-count{font-size:.68rem;font-weight:700;color:var(--muted-2)}

  /* ── Right panel (unchanged baseline structure) ──────────── */
  .pl-panel-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;
    transition:opacity .25s;pointer-events:none}
  .pl-panel-backdrop.open{opacity:1;pointer-events:auto}
  .pl-panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);
    z-index:201;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.2);
    transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);max-height:calc(100dvh - 48px)}
  .pl-panel.open{transform:translateX(0)}
  @media(max-width:639px){
    .pl-panel{top:auto;left:0;right:0;width:100% !important;max-height:calc(100dvh - 48px);
      border-radius:18px 18px 0 0;box-shadow:0 -6px 40px rgba(0,0,0,.28);transform:translateY(110%)}
    .pl-panel.open{transform:translateY(0)}
    .pl-panel::before{content:'';display:block;width:36px;height:4px;border-radius:2px;
      background:var(--border);margin:12px auto -4px;flex-shrink:0}
  }
  .pl-panel-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;flex-shrink:0}
  .pl-panel-hd-body{flex:1;min-width:0}
  .pl-panel-title{font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-panel-sub{font-size:.75rem;color:var(--muted-2);margin-top:2px}
  .pl-panel-body{flex:1;overflow-y:auto;padding:0 20px 20px;min-height:0;overscroll-behavior:contain}
  .pl-panel-ft{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;position:sticky;bottom:0;background:var(--surface);z-index:1}
  .pl-panel-alert{border:1px solid transparent;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.82rem;line-height:1.4;display:flex;align-items:center;gap:10px}
  .pl-panel-alert-info{background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.22);color:var(--text)}
  .pl-panel-alert-success{background:rgba(34,197,94,.09);border-color:rgba(34,197,94,.22);color:var(--text)}
  .pl-panel-alert-warning{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2);color:var(--text)}
  .pl-panel-alert .btn{font-size:.72rem;padding:6px 10px}

  .pl-photo-strip{display:flex;gap:8px;overflow-x:auto;padding:16px 0 8px;scrollbar-width:none}
  .pl-photo-strip::-webkit-scrollbar{display:none}
  .pl-photo-strip img{width:140px;height:96px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--surface-2);cursor:pointer}
  .pl-photo-count{font-size:.7rem;color:var(--muted-2);margin-top:2px}

  .pl-gallery{position:relative;margin:0 -20px;padding:0 20px}
  .pl-gallery-main{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:16/10;margin-bottom:10px}
  .pl-gallery-main img{width:100%;height:100%;object-fit:cover;display:block}
  .pl-gallery-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;
    border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;backdrop-filter:blur(4px);transition:background .15s}
  .pl-gallery-nav:hover{background:rgba(0,0,0,.75)}
  .pl-gallery-nav.prev{left:8px}
  .pl-gallery-nav.next{right:8px}
  .pl-gallery-counter{position:absolute;bottom:8px;right:8px;z-index:3;background:rgba(0,0,0,.7);color:#fff;
    font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:12px}
  .pl-gallery-thumbs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
  .pl-gallery-thumbs::-webkit-scrollbar{display:none}
  .pl-gallery-thumb{width:56px;height:42px;border-radius:6px;object-fit:cover;flex-shrink:0;
    cursor:pointer;border:2px solid transparent;opacity:.6;transition:all .15s}
  .pl-gallery-thumb.active{border-color:var(--brand);opacity:1}
  .pl-gallery-thumb:hover{opacity:.9}

  .pl-section{margin-top:20px}
  .pl-section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted-2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .pl-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pl-form-grid.full{grid-template-columns:1fr}
  .pl-field{display:flex;flex-direction:column;gap:4px}
  .pl-field label{font-size:.7rem;font-weight:600;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em}
  .pl-field input,.pl-field select,.pl-field textarea{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:7px 10px;font-size:.84rem;color:var(--text);font-family:inherit;width:100%;box-sizing:border-box}
  .pl-field input:focus,.pl-field select:focus,.pl-field textarea:focus{outline:none;border-color:var(--brand)}
  .pl-field textarea{resize:vertical;min-height:80px}
  .pl-field.required label::after{content:' *';color:var(--danger)}

  .missing-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .missing-tag{font-size:.65rem;background:rgba(239,68,68,.1);color:#dc2626;
    padding:2px 7px;border-radius:4px;font-weight:600}

  .pl-source-link{font-size:.75rem;color:var(--brand);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .pl-source-link:hover{text-decoration:underline}

  #load-more-wrap{text-align:center;padding:20px 0 80px}

  .pl-bulk-bar{position:fixed;bottom:0;left:0;right:0;z-index:300;display:flex;align-items:center;gap:12px;
    padding:14px 20px;background:var(--brand,#6366f1);color:#fff;box-shadow:0 -4px 24px rgba(0,0,0,.2);
    transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
  .pl-bulk-bar.visible{transform:translateY(0)}
  .pl-bulk-bar .btn-bulk-clear{color:#fff;border:1px solid rgba(255,255,255,.35);
    background:transparent;padding:6px 14px;border-radius:var(--r-sm);font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
  .pl-bulk-bar .btn-bulk-clear:hover{background:rgba(255,255,255,.12)}
  .pl-bulk-bar .btn-bulk-pub{background:#fff;color:var(--brand,#6366f1);border:none;
    padding:7px 16px;border-radius:var(--r-sm);font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
  .pl-bulk-bar .btn-bulk-pub:hover{opacity:.92}
  .pl-bulk-bar .btn-bulk-pub:disabled{opacity:.6;cursor:not-allowed}

  /* ── Photo editor modal ────────────────────────────────── */
  .pl-photo-edit-item{display:flex;align-items:center;gap:10px;padding:10px;
    border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2)}
  .pl-photo-edit-item img{width:72px;height:52px;object-fit:cover;border-radius:6px;flex-shrink:0}
  .pl-photo-edit-actions{display:flex;gap:4px;flex-wrap:wrap}
  .pl-photo-edit-actions .btn{font-size:.68rem;padding:3px 8px}
  .pl-photo-edit-item{drag-handle: grab; touch-action: none}
  .pl-photo-edit-item.dragging{opacity:.6;transform:scale(.98);border-color:var(--brand)!important;box-shadow:var(--pl-shadow)}
  .pl-photo-edit-item.pl-photo-primary{border-left:3px solid var(--brand)}
  .pl-photo-upload-btn{display:flex;align-items:center;gap:8px;justify-content:center;
    padding:12px;border:2px dashed var(--border);border-radius:var(--r-sm);
    color:var(--brand);font-size:.82rem;font-weight:600;cursor:pointer;
    transition:all .15s;background:var(--surface-2)}
  .pl-photo-upload-btn:hover{border-color:var(--brand);background:rgba(99,102,241,.05)}
  .pl-photo-upload-btn input[type="file"]{display:none}

  /* ── Import modal ──────────────────────────────────────── */
  #pl-import-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:16px}
  .pl-import-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .pl-import-dialog{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md,12px);
    width:100%;max-width:520px;box-shadow:0 8px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;animation:fadeUp .2s ease}
  .pl-import-hd{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .pl-import-close{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--muted-2);font-size:1.1rem;padding:2px 6px;border-radius:4px}
  .pl-import-close:hover{background:var(--surface-2);color:var(--text)}
  .pl-import-body{padding:18px}
  .pl-import-ft{padding:14px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}

  /* iOS Importer banner */
  .importer-banner{display:flex;align-items:center;gap:12px;
    background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.10));
    border:1px solid rgba(99,102,241,.3);border-radius:var(--r-md,10px);padding:12px 14px;margin-bottom:var(--sp-4)}
  .importer-banner-icon{flex-shrink:0;width:36px;height:36px;border-radius:8px;
    background:rgba(99,102,241,.22);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
  .importer-banner-body{flex:1;min-width:0}
  .importer-banner-title{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:2px}
  .importer-banner-sub{font-size:.72rem;color:var(--muted-2);line-height:1.4}
  .importer-banner-actions{display:flex;gap:8px;flex-shrink:0;align-items:center}
  .importer-banner-dismiss{background:none;border:none;cursor:pointer;color:var(--muted-2);font-size:1.1rem;padding:2px 4px;line-height:1}
  .importer-banner-dismiss:hover{color:var(--text)}
  .importer-banner[hidden]{display:none!important}

  /* Old sidebar hidden — replaced by chip row */
  .pl-folder-sidebar{display:none}

  /* ── Kanban / Pipeline board view ─────────────────────────── */
  .pl-kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;min-height:calc(100vh - 280px);scroll-snap-type:x proximity}
  .pl-kanban-col{flex:0 0 320px;min-width:280px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--pl-radius);display:flex;flex-direction:column;max-height:calc(100dvh - 320px);scroll-snap-align:start}
  .pl-kanban-col-hd{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
  .pl-kanban-col-title{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2)}
  .pl-kanban-col-count{margin-left:auto;font-size:.68rem;font-weight:700;background:rgba(255,255,255,.12);color:var(--muted-2);padding:2px 8px;border-radius:99px}
  .pl-kanban-col-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
  .pl-kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--pl-radius-sm);padding:10px;cursor:grab;transition:transform .15s,box-shadow .15s,border-color .15s;contain:layout style paint}
  .pl-kanban-card:hover{border-color:var(--brand);box-shadow:var(--pl-shadow);transform:translateY(-1px)}
  .pl-kanban-card.dragging{opacity:.5;transform:rotate(2deg)}
  .pl-kanban-card .pl-kanban-addr{font-size:.82rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-kanban-card .pl-kanban-meta{font-size:.72rem;color:var(--muted-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-kanban-card .pl-kanban-foot{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .pl-kanban-empty{text-align:center;padding:24px 12px;color:var(--muted-2);font-size:.78rem}
  @media(max-width:639px){
    .pl-kanban-col{flex:0 0 85vw;min-width:85vw;max-height:calc(100dvh - 280px)}
  }

  /* ── Undo toast ───────────────────────────────────────────── */
  .undo-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);z-index:500;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--pl-radius-sm);box-shadow:var(--pl-shadow-lg);opacity:0;transition:all .25s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:calc(100vw - 32px)}
  .undo-toast.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .undo-btn{background:var(--brand);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap}
  .undo-btn:hover{opacity:.9}

  /* ── Skeleton loading ─────────────────────────────────────── */
  .skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,rgba(255,255,255,.08) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:4px}
  .sk-line{height:10px;margin:4px 0}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ── Performance: contain layout shifts ───────────────────── */
  .pl-card{contain:layout style paint}
  .pl-kanban-card{contain:layout style paint}
  .pl-gallery-thumb{contain:layout style paint}
 </style>
</head>
<body data-page-title="Pipeline" data-page-sub="Scraped listings for review">
<div class="app">
  <main class="app-content">

    <!-- iOS Importer install banner (dismissed permanently via localStorage) -->
    <div class="importer-banner" id="importer-banner">
      <div class="importer-banner-icon">📱</div>
      <div class="importer-banner-body">
        <div class="importer-banner-title">Import Zillow listings from your iPhone</div>
        <div class="importer-banner-sub">Use the Orion browser extension on iOS — it shows a "Save to Pipeline" button directly on Zillow pages. Or use the "Import URL" button above to paste a Zillow link.</div>
      </div>
      <div class="importer-banner-actions">
        <button class="importer-banner-dismiss" id="importer-banner-dismiss" title="Dismiss">✕</button>
      </div>
    </div>

    <!-- Premium folder chips row (mobile-first horizontally scrollable) -->
    <div class="pl-folder-scroll" id="pl-folders"></div>

    <!-- Active folder banner -->
    <div class="pl-folder-banner" id="pl-folder-banner"></div>

    <!-- Toolbar -->
    <div class="pl-toolbar">
      <div class="chip-row" id="status-chips" role="tablist" aria-label="Filter by status">
        <button class="chip" data-pl-status="scraped">New <span class="chip-count" id="cnt-scraped">…</span></button>
        <button class="chip" data-pl-status="edited">Edited <span class="chip-count" id="cnt-edited">…</span></button>
        <button class="chip active" data-pl-status="all">All <span class="chip-count" id="cnt-all">…</span></button>
        <button class="chip" data-pl-status="published">Published <span class="chip-count" id="cnt-published">…</span></button>
        <button class="chip" data-pl-status="archived">Archived <span class="chip-count" id="cnt-archived">…</span></button>
      </div>
      <div class="source-chip-row" id="source-chips" role="tablist" aria-label="Filter by source">

        <button class="chip chip-sm" data-pl-source="realtor">Realtor</button>
      </div>
      <div class="source-chip-row" id="quality-chips" role="tablist" aria-label="Filter by quality score">
        <span class="source-filter-label">Quality:</span>
        <button class="chip chip-sm active" data-pl-quality="">All</button>
        <button class="chip chip-sm" data-pl-quality="high" title="Score ≥ 80 — ready to publish">✓ Ready</button>
        <button class="chip chip-sm" data-pl-quality="mid"  title="Score 60–79 — a few fields missing">Needs work</button>

      </div>
      <div style="width:100%;display:flex;align-items:flex-start;gap:8px">
        <div class="pl-search-wrap" style="flex:1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="pl-search" type="search" placeholder="Search by address, city, or ZIP…" autocomplete="off" aria-label="Search pipeline listings">
          <button class="pl-search-clear" id="pl-search-clear" aria-label="Clear search">✕</button>
        </div>
        <button class="btn btn-outline" id="pl-import-url-btn" title="Import a Zillow listing by pasting its URL" style="white-space:nowrap;flex-shrink:0">
          ↑ Import URL
        </button>
        <button class="btn btn-ghost" id="pl-refresh-btn" title="Reload pipeline from server" style="white-space:nowrap;flex-shrink:0;padding:7px 10px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <button class="btn btn-ghost" id="pl-view-toggle" title="Toggle list / pipeline view" style="white-space:nowrap;flex-shrink:0;padding:7px 10px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
      </div>
      <div class="pl-search-count" id="pl-search-count"></div>
    </div>

    <!-- Listing cards -->
    <div id="pl-list">
      <div class="pl-card" style="pointer-events:none">

          <div class="skeleton sk-line" style="width:45%;height:10px"></div>
          <div class="skeleton sk-line" style="width:28%;height:10px"></div>
        </div>
        <div class="pl-card-ft"></div>
      </div>
      <div class="pl-card" style="pointer-events:none">
        <div class="pl-thumb-wrap"><div class="pl-thumb-placeholder"></div></div>
        <div class="pl-body" style="padding:12px 14px 8px;gap:6px">
          <div class="skeleton sk-line" style="width:60%;height:13px"></div>
          <div class="skeleton sk-line" style="width:38%;height:10px"></div>
          <div class="skeleton sk-line" style="width:24%;height:10px"></div>
        </div>
        <div class="pl-card-ft"></div>
      </div>
      <div class="pl-card" style="pointer-events:none">
        <div class="pl-thumb-wrap"><div class="pl-thumb-placeholder"></div></div>
        <div class="pl-body" style="padding:12px 14px 8px;gap:6px">
          <div class="skeleton sk-line" style="width:72%;height:13px"></div>
          <div class="skeleton sk-line" style="width:42%;height:10px"></div>
          <div class="skeleton sk-line" style="width:30%;height:10px"></div>
        </div>
        <div class="pl-card-ft"></div>
      </div>
    </div>

    <div id="load-more-wrap" style="display:none">
      <button class="btn btn-outline" id="load-more-btn">Load more</button>
    </div>

  </main>
</div>

<!-- Right-side detail / edit panel -->
<div class="pl-panel-backdrop" id="pl-backdrop"></div>
<div class="pl-panel" id="pl-panel" role="dialog" aria-modal="true" aria-label="Listing detail"></div>

<!-- Bulk action bar (slides up from bottom when cards are selected) -->
<div class="pl-bulk-bar" id="pl-bulk-bar" role="toolbar" aria-label="Bulk actions">

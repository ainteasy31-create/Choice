name: Batch Market Scraper

# Runs all city-specific batch scripts (arlington_tx_batch.py, dallas_ga_batch.py, etc.)
# All credentials are wired permanently via GitHub Secrets — no manual input needed.
#
# To run a specific batch manually: trigger this workflow and pick the market.
# Scheduled: runs every day at 03:00 UTC (after daily scraper).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      market:
        description: 'Which batch to run (leave blank to run ALL)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - arlington_tx
          - dallas_ga
          - st_louis
      dry_run:
        description: 'Dry run — no DB writes'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target:
        description: 'Target number of listings to publish (default: 10)'
        required: false
        default: '10'

jobs:
  batch:
    name: Run batch scraper(s)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # ── All credentials permanently wired ────────────────────────────────
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
      IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
      IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SITE_BASE_URL: ${{ secrets.SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install homeharvest requests openai pillow python-dotenv

      - name: Validate required secrets are present
        run: |
          MISSING=""
          [ -z "$SUPABASE_URL" ]            && MISSING="$MISSING SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$IMAGEKIT_PRIVATE_KEY" ]    && MISSING="$MISSING IMAGEKIT_PRIVATE_KEY"
          [ -z "$IMAGEKIT_URL_ENDPOINT" ]   && MISSING="$MISSING IMAGEKIT_URL_ENDPOINT (set as IMAGEKIT_URL in Secrets)"
          if [ -n "$MISSING" ]; then
            echo "ERROR: Required secrets not set:$MISSING"
            echo "Go to: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "WARNING: OPENAI_API_KEY not set — AI description rewriting will be skipped."
            echo "Add it at: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
          fi
          echo "All required secrets present."

      - name: Run Arlington / Euless / Grapevine TX batch
        if: github.event.inputs.market == '' || github.event.inputs.market == 'arlington_tx'
        run: |
          DRY="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          TARGET="${{ github.event.inputs.target || '10' }}"
          echo "▶ Arlington TX batch (target=$TARGET, dry=${DRY:-no})"
          python scraper/arlington_tx_batch.py --target "$TARGET" $DRY 2>&1 | tee batch-arlington.log
          exit "${PIPESTATUS[0]}"

      - name: Run Dallas GA batch
        if: github.event.inputs.market == '' || github.event.inputs.market == 'dallas_ga'
        run: |
          DRY="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          TARGET="${{ github.event.inputs.target || '10' }}"
          echo "▶ Dallas GA batch (target=$TARGET, dry=${DRY:-no})"
          python scraper/dallas_ga_batch.py --target "$TARGET" $DRY 2>&1 | tee batch-dallas.log
          exit "${PIPESTATUS[0]}"
        continue-on-error: true

      - name: Run St. Louis batch
        if: github.event.inputs.market == '' || github.event.inputs.market == 'st_louis'
        run: |
          DRY="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          TARGET="${{ github.event.inputs.target || '10' }}"
          echo "▶ St. Louis batch (target=$TARGET, dry=${DRY:-no})"
          python scraper/stl_batch.py --target "$TARGET" $DRY 2>&1 | tee batch-stl.log
          exit "${PIPESTATUS[0]}"
        continue-on-error: true

      - name: Upload batch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-logs-${{ github.run_id }}
          path: batch-*.log
          retention-days: 30

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Batch Scraper Failed\n\n';
            ['batch-arlington.log','batch-dallas.log','batch-stl.log'].forEach(f => {
              try {
                const content = fs.readFileSync(f, 'utf8').slice(-3000);
                body += `### ${f}\n\`\`\`\n${content}\n\`\`\`\n\n`;
              } catch(e) {}
            });
            body += `**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[Batch] Scraper failure — ${new Date().toISOString().slice(0,10)}`,
              body, labels: ['batch-scraper','needs-review'],
            });

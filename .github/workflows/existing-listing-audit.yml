name: Daily Listing Audit

on:
  schedule:
    # Run every day at 06:00 UTC (before business hours)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      fix:
        description: "Unpublish non-compliant listings (true/false)"
        required: false
        default: "false"
      dry_run:
        description: "Dry run — log only, no writes (true/false)"
        required: false
        default: "false"

jobs:
  audit:
    name: Existing Listing Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Run audit
        id: run_audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FIX_FLAG=""
          DRY_FLAG=""

          if [ "${{ github.event.inputs.fix }}" = "true" ]; then
            FIX_FLAG="--fix"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          # FIX H4: Capture stdout to a log file so the artifact is never empty
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs: report only (no auto-unpublish — human reviews first)
            python3 scraper/listing_audit.py --report-only 2>&1 | tee audit-report.log
          else
            python3 scraper/listing_audit.py $FIX_FLAG $DRY_FLAG 2>&1 | tee audit-report.log
          fi

          # Propagate exit code through tee
          exit "${PIPESTATUS[0]}"

      # FIX H5: Open a GitHub issue when the audit finds non-compliant listings
      - name: Notify on non-compliant listings
        if: failure() && steps.run_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Daily Listing Audit — Non-Compliant Listings Found\n\n';
            try {
              body += '```\n' + fs.readFileSync('audit-report.log', 'utf8').slice(0, 6000) + '\n```\n\n';
            } catch (e) {
              body += '_Could not read audit report log._\n\n';
            }
            body += `**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            body += '\nReview the full log in the Actions run artifacts, then run the workflow manually with `fix=true` to unpublish failing listings.';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Audit] Non-compliant listings detected — ${new Date().toISOString().slice(0,10)}`,
              body: body,
              labels: ['listing-audit', 'needs-review'],
            });

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_id }}
          path: audit-report.log   # FIX H4: explicit file, not *.log glob
          retention-days: 30
